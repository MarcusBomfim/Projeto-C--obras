# O front-end de produção e a API na mesma origem, como em desenvolvimento
# (ADR-0018): o nginx serve o que o Vite compilou e repassa /api para a API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Só o que é desta origem roda: o front-end não carrega nada de fora.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # O nome dos arquivos do Vite muda quando o conteúdo muda: cache de um ano.
    location /assets/ {
        expires 1y;
    }

    # Qualquer outro caminho é uma rota do React: o index.html, sempre revalidado.
    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
